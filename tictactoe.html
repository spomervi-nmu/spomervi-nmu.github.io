<body>	
    <div class="mainbar">
        <a class="boxed-link" href="./index.html">Home</a>
        <a class="boxed-link" href="./tictactoe.html">Tic Tac Toe</a>
        <a class="boxed-link" href="./rockpaperscissors.html">Rock, Paper, Scisssors</a>

	<h1 class="centered">Tic Tac Toe!</h1>
	<h3 class="centered"> Current Player: <span id="cturn"></span></h3>
	<table id="board" class="autocenter"></table>

<script>
// Assume X goes first...
let curPlayer = "X";
let winnerFound = false;
// Half the time, switch it to "O"
if (0.5 > Math.random()){
	curPlayer="O";
}
// Display the First player
document.getElementById("cturn").innerText=curPlayer;

// make the tic tac toe board:
// assume tictactoe has the following layout:
// 0 | 1 | 2
//-----------
// 3 | 4 | 5
//-----------
// 6 | 7 | 8 

//make the board
boardContent = "";
let row = 0;
while(row < 3){
	let col = 0;
	boardContent = boardContent + "<tr>";
	while(col < 3){
		boardContent = boardContent + "<td></td>";
		col = col + 1;
	}
	boardContent = boardContent + "</tr>";
	row = row + 1;
}
document.getElementById("board").innerHTML=boardContent;

//give everything an ID that is class0 to class8
allTD = document.querySelectorAll("td");
let i = 0;
while( i < allTD.length ){
	allTD[i].addEventListener("click", clicked);
	i = i + 1;
}


// A function for when a td is clicked
function clicked(){
	let target = event.target;

	//check if the cell clicked was blank...
	if(target.innerHTML == ""){
		//if so, play your thing
		target.innerHTML = curPlayer;
		//swap the current player
		if(curPlayer == "X"){
			curPlayer = "O";
		}
		else{
			curPlayer = "X";
		}
		// show the current player's turn
		document.getElementById("cturn") = curPlayer;
		return;
	}


}

</script>
